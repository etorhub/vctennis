name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build and verify dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build, and verify dist
        run: npm run ci
