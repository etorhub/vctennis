[build]
  command = "npx astro db push --remote && node scripts/migrate-apartment-number.js && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.10.0"

[[plugins]]
  package = "./netlify/plugins/smoke-test"

# Core security headers (issue #55). CSP ships in Report-Only mode first:
# Alpine.js (unsafe-eval for expression evaluation, unsafe-inline for the
# is:inline theme/service-worker bootstrap scripts in Layout.astro) and
# Better Auth need to be verified against real traffic via the report
# endpoint before this becomes enforcing.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report"

# Static passthrough files under public/ aren't content-hashed, so Netlify's
# generic default (short) cache headers apply unless overridden here (issue #66).
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker file itself must always be revalidated so browsers
# pick up updates promptly, per the standard SW update model.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
